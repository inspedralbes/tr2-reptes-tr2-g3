services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  frontend:
    build: ./enginy
    volumes:
      - ./enginy:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - backend